[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "p5-task-failure"
version = "0.1.0"
description = "P5 Distributed Task Allocation & Failure Recovery — SYNERGY warehouse project"
requires-python = ">=3.10"
dependencies = []   # pure stdlib — no runtime deps

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["p5*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
