# Without this, setuptools installs console_scripts to <prefix>/bin, where
# `ros2 run` cannot find them: launching nav2_multi_amr.launch.py failed with
# "No executable found" for dynamic_lidar_tf, so no base_link -> lidar_link
# transform was ever published and the costmaps received zero laser
# observations. Every other Python package in this workspace already has one.
[develop]
script_dir=$base/lib/synergy_nav2
[install]
install_scripts=$base/lib/synergy_nav2
