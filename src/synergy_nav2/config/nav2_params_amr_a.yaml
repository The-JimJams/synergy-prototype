amr_a:
  amcl:
    ros__parameters:
      use_sim_time: True
      global_frame_id: "map"
      odom_frame_id: "amr_blue/odom"
      base_frame_id: "amr_blue/base_link"
      scan_topic: "/amr_a/scan"
      min_particles: 500
      max_particles: 2000
      initial_pose:
        x: -3.5
        y: 5.25
        z: 0.0
        yaw: 0.0
      set_initial_pose: true

  map_server:
    ros__parameters:
      use_sim_time: True
      yaml_filename: ""

  planner_server:
    ros__parameters:
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 20.0
      enable_stamped_cmd_vel: false
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.2
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0

      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25

      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: True
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.6
        max_vel_y: 0.0
        max_vel_theta: 1.4
        min_speed_xy: 0.0
        max_speed_xy: 0.6
        min_speed_theta: 0.0
        acc_lim_x: 1.2
        acc_lim_y: 0.0
        acc_lim_theta: 3.2
        decel_lim_x: -1.2
        decel_lim_y: 0.0
        decel_lim_theta: -3.2
        vx_samples: 20
        vy_samples: 1
        vtheta_samples: 20
        sim_time: 1.7
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 0.2
        xy_goal_tolerance: 0.25
        short_circuit_trajectory_evaluation: True
        stateful: True
        critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: "amr_blue/odom"
        robot_base_frame: "amr_blue/base_link"
        use_sim_time: True
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        footprint: "[[-0.31, -0.26], [-0.31, 0.26], [0.31, 0.26], [0.31, -0.26]]"
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: "/amr_a/scan"
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costmap: True

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: "map"
        robot_base_frame: "amr_blue/base_link"
        use_sim_time: True
        footprint: "[[-0.31, -0.26], [-0.31, 0.26], [0.31, 0.26], [0.31, -0.26]]"
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: "/amr_a/scan"
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.55
        always_send_full_costmap: True

  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: "map"
      robot_base_frame: "amr_blue/base_link"
      odom_frame: "amr_blue/odom"
      bt_loop_duration: 10
      default_server_timeout: 20
      navigators: ['navigate_to_pose', 'navigate_through_poses']
      navigate_to_pose:
        plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      navigate_through_poses:
        plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

  behavior_server:
    ros__parameters:
      use_sim_time: True
      global_frame: "map"
      robot_base_frame: "amr_blue/base_link"
      odom_frame: "amr_blue/odom"
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      wait:
        plugin: "nav2_behaviors::Wait"

  lifecycle_manager:
    ros__parameters:
      use_sim_time: True
      autostart: true
      node_names: ['map_server', 'amcl', 'planner_server', 'controller_server', 'bt_navigator', 'behavior_server']
      bond_timeout: 0.0
