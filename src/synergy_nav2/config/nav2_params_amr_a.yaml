amr_a:
  amcl:
    ros__parameters:
      use_sim_time: True
      global_frame_id: "map"
      odom_frame_id: "amr_blue/odom"
      base_frame_id: "amr_blue/base_link"
      scan_topic: "/amr_a/scan"
      min_particles: 500
      max_particles: 2000
      initial_pose:
        x: -3.5
        y: 5.25
        z: 0.0
        yaw: 0.0
      set_initial_pose: true

  map_server:
    ros__parameters:
      use_sim_time: True
      yaml_filename: ""

  planner_server:
    ros__parameters:
      use_sim_time: True
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 20.0
      enable_stamped_cmd_vel: false
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.2
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0

      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        # Heading on arrival is irrelevant for a pickup/dropoff transport task,
        # and _send_nav2_goal() always requests yaw 0, so a robot that had
        # already arrived still owed a large in-place rotation. Rotating in
        # place is not translation, so SimpleProgressChecker (0.5 m in 10 s)
        # scored it as no progress and aborted the goal ON ARRIVAL with
        # error 105 "Failed to make progress" -- measured with the robot
        # 0.23 m from a 0.25 m tolerance. Accept any final heading.
        yaw_goal_tolerance: 3.15

      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: True
        min_vel_x: 0.0
        min_vel_y: 0.0
        max_vel_x: 0.6
        max_vel_y: 0.0
        max_vel_theta: 1.4
        min_speed_xy: 0.0
        max_speed_xy: 0.6
        min_speed_theta: 0.0
        acc_lim_x: 1.2
        acc_lim_y: 0.0
        acc_lim_theta: 3.2
        decel_lim_x: -1.2
        decel_lim_y: 0.0
        decel_lim_theta: -3.2
        vx_samples: 20
        vy_samples: 1
        vtheta_samples: 20
        sim_time: 1.7
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 0.2
        xy_goal_tolerance: 0.25
        short_circuit_trajectory_evaluation: True
        stateful: True
        critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        # DWB's BaseObstacle weight defaults to 0.02, i.e. obstacle cost barely
        # influences which trajectory is chosen -- clearance is left almost
        # entirely to inflation. In 2.6 m perimeter corridors and 1.5 m bollard
        # gates that let robots graze the racking: one ended a leg at (7.35,
        # 2.59), 0.05 m from the east rack, and NavFn then refused to plan at
        # all because the start cell was lethal ("Failed to create plan with
        # tolerance of 0.500000") while backup recovery could not escape.
        # Weighting clearance properly keeps them off the shelving instead.
        BaseObstacle.scale: 0.5
        PathDist.scale: 32.0
        GoalDist.scale: 24.0
        PathAlign.scale: 32.0
        GoalAlign.scale: 24.0
        PathAlign.forward_point_distance: 0.20
        GoalAlign.forward_point_distance: 0.20

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: "amr_blue/odom"
        robot_base_frame: "amr_blue/base_link"
        use_sim_time: True
        rolling_window: true
        # Must be at least 2 x obstacle_max_range (2.5 m) so observations the
        # obstacle layer marks are not clipped straight back out of the window.
        width: 6
        height: 6
        resolution: 0.05
        footprint: "[[-0.31, -0.26], [-0.31, 0.26], [0.31, 0.26], [0.31, -0.26]]"
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: "/amr_a/scan"
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          # Tuned to this warehouse's chokepoints, not left at the Nav2 default.
          # The I1/I2 bollard gates and the channels beside them offer at most
          # 0.50-0.65 m clearance. With inflation_radius 0.55 every cell on those
          # routes stayed permanently inflated, so the planner had no zero-cost
          # channel and the controller no gradient to hold the centre-line: the
          # robot drifted onto the west I2 bollard (measured clearance at the
          # stall point 0.22 m, inside its own 0.26 m inscribed radius) and DWB
          # reported "0 valid trajectories out of 419".
          # 0.45 m still exceeds the 0.405 m circumscribed radius, which Nav2
          # requires, while leaving the gate centres genuinely free.
          cost_scaling_factor: 5.0
          inflation_radius: 0.45
        always_send_full_costmap: True

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: "map"
        robot_base_frame: "amr_blue/base_link"
        use_sim_time: True
        footprint: "[[-0.31, -0.26], [-0.31, 0.26], [0.31, 0.26], [0.31, -0.26]]"
        resolution: 0.05
        track_unknown_space: true
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: "/amr_a/scan"
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            raytrace_max_range: 3.0
            raytrace_min_range: 0.0
            obstacle_max_range: 2.5
            obstacle_min_range: 0.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          # Tuned to this warehouse's chokepoints, not left at the Nav2 default.
          # The I1/I2 bollard gates and the channels beside them offer at most
          # 0.50-0.65 m clearance. With inflation_radius 0.55 every cell on those
          # routes stayed permanently inflated, so the planner had no zero-cost
          # channel and the controller no gradient to hold the centre-line: the
          # robot drifted onto the west I2 bollard (measured clearance at the
          # stall point 0.22 m, inside its own 0.26 m inscribed radius) and DWB
          # reported "0 valid trajectories out of 419".
          # 0.45 m still exceeds the 0.405 m circumscribed radius, which Nav2
          # requires, while leaving the gate centres genuinely free.
          cost_scaling_factor: 5.0
          inflation_radius: 0.45
        always_send_full_costmap: True

  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: "map"
      robot_base_frame: "amr_blue/base_link"
      odom_frame: "amr_blue/odom"
      bt_loop_duration: 10
      # Raised from the 20 ms / 1000 ms defaults. Three Nav2 stacks activating
      # at once could not stand up their action/service servers inside those
      # windows: bt_navigator aborted with "Service server
      # global_costmap/clear_entirely_global_costmap not available" and, once
      # running, goals failed with error 107 "Behavior Tree action client timed
      # out waiting". These are startup/ load tolerances, not control rates.
      default_server_timeout: 200
      wait_for_service_timeout: 5000
      navigators: ['navigate_to_pose', 'navigate_through_poses']
      navigate_to_pose:
        plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      navigate_through_poses:
        plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

  behavior_server:
    ros__parameters:
      use_sim_time: True
      global_frame: "map"
      robot_base_frame: "amr_blue/base_link"
      # nav2_behaviors reads `local_frame`, not `odom_frame`; the latter was
      # silently ignored, so backup/spin fell back to the default frame "odom",
      # which does not exist in this multi-robot TF tree. Every recovery aborted
      # with error 712 "Initial robot pose is not available", leaving a stuck
      # robot with no way out.
      local_frame: "amr_blue/odom"
      odom_frame: "amr_blue/odom"
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      wait:
        plugin: "nav2_behaviors::Wait"

  lifecycle_manager:
    ros__parameters:
      use_sim_time: True
      autostart: true
      # Order matters: bt_navigator builds its behaviour tree on activation and
      # that tree references the costmap-clearing services owned by
      # planner_server/controller_server and the recovery actions owned by
      # behavior_server. With bt_navigator ahead of behavior_server it raced
      # them and bringup aborted. This is Nav2's documented activation order.
      node_names: ['map_server', 'amcl', 'controller_server', 'planner_server', 'behavior_server', 'bt_navigator']
      bond_timeout: 0.0
